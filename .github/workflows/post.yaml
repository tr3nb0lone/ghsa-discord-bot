name: GHSA Bot

on:
  schedule:
    - cron: "0 */18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: go run bot.go

      - name: Commit log changes
        run: |
          if [ -n "$(git status --porcelain log.jsonl)" ]; then
            git config user.name "tr3nb0lone"
            git config user.email "tr3nacetate@proton.me"
            git add log.jsonl
            git commit -m "chore: update advisory log"
            git push
          else
            echo "No log changes to commit"
          fi
